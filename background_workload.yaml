# background_workload.yaml
# Simulate cluster đang bận — deploy trước khi chạy DRL scheduler
# Mỗi node bị chiếm ~40-60% CPU và RAM để tạo áp lực thật
#
# Deploy:  kubectl apply -f background_workload.yaml
# Cleanup: kubectl delete -f background_workload.yaml

---
# ── NODE m02: 2 pods chiếm ~50% tài nguyên ──────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: bg-m02-heavy
  namespace: drl-scheduler
  labels:
    app: background
spec:
  nodeName: minikube-m02
  restartPolicy: Always
  containers:
  - name: workload
    image: nginx:alpine
    resources:
      requests:
        cpu: "2000m"      # 2 cores / 8 cores = 25%
        memory: "2048Mi"  # 2 GB / 7.8 GB = 26%
      limits:
        cpu: "2000m"
        memory: "2048Mi"

---
apiVersion: v1
kind: Pod
metadata:
  name: bg-m02-light
  namespace: drl-scheduler
  labels:
    app: background
spec:
  nodeName: minikube-m02
  restartPolicy: Always
  containers:
  - name: workload
    image: nginx:alpine
    resources:
      requests:
        cpu: "1500m"      # tổng m02: ~43% CPU
        memory: "1536Mi"  # tổng m02: ~46% RAM
      limits:
        cpu: "1500m"
        memory: "1536Mi"

---
# ── NODE m03: 1 pod chiếm ~60% tài nguyên ───────────────────────────────────
apiVersion: v1
