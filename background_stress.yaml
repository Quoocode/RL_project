apiVersion: v1
kind: Namespace
metadata:
  name: drl-scheduler
---
apiVersion: v1
kind: Pod
metadata:
  name: bg-light-m02
  namespace: drl-scheduler
  labels:
    app: background-load
spec:
  nodeName: minikube-m02
  restartPolicy: Never
  containers:
  - name: stress
    image: python:3.11-alpine
    command: ["/bin/sh", "-c"]
    args:
      - |
        python - <<'PY' &
        import time
        x = bytearray(300 * 1024 * 1024)
        time.sleep(36000)
        PY
        yes > /dev/null &
        wait
    resources:
      requests:
        cpu: "1000m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "512Mi"
---
